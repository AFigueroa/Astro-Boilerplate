name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# "false" until public launch: every page ships with noindex, and Lighthouse
# skips its crawlability audit (which would otherwise fail on purpose).
# Flip the repo variable PUBLIC_INDEXABLE to "true" at launch.
env:
  PUBLIC_INDEXABLE: ${{ vars.PUBLIC_INDEXABLE || 'false' }}

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run test
      - uses: actions/upload-artifact@v4
        with:
          name: reports-unit
          path: reports/vitest.json
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: npm audit report
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
      - name: npm audit (fails on high/critical)
        run: npm audit --audit-level=high
      # Runs once a SNYK_TOKEN repo secret exists; skipped until then.
      - name: Snyk (fails on high/critical)
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk@1 test --severity-threshold=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-security
          path: reports/npm-audit.json
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e-tests:
    name: E2E & accessibility tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: reports-e2e
          path: |
            reports/playwright.json
            reports/axe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Accessibility, best-practices, SEO, and CLS budgets fail the job;
      # performance only warns (shared CI runners make it noisy).
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun ${{ env.PUBLIC_INDEXABLE != 'true' && '--collect.settings.skipAudits=is-crawlable' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-lighthouse
          path: reports/lighthouse
          retention-days: 7

  # Publishes only after every check passes, so a failing test blocks the
  # release. The site is rebuilt with src/data/quality.json generated from
  # this run's reports — the only difference from the tested `dist`.
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [unit-tests, security, e2e-tests, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: reports-raw
      - name: Collect reports
        run: |
          mkdir -p reports/lighthouse
          cp reports-raw/reports-unit/vitest.json reports/
          cp reports-raw/reports-security/npm-audit.json reports/
          cp reports-raw/reports-e2e/playwright.json reports/
          cp -r reports-raw/reports-e2e/axe reports/
          cp -r reports-raw/reports-lighthouse/. reports/lighthouse/
      - run: npm run quality
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
