# Cloudflare Workers config — static site served as Workers static assets.
#
# Deployed by the `deploy` job in .github/workflows/ci.yml (`wrangler deploy`)
# after every check passes — not by Cloudflare's Workers Builds Git
# integration, which would deploy without waiting for tests. Keep Workers
# Builds disconnected for this Worker.
#
# `wrangler deploy` reads this file and uploads ./dist. There's no Worker
# script (`main`) — the site is fully prerendered, so Cloudflare serves the
# files directly. `name` is the Worker's name in the Cloudflare dashboard.

name = "batey-labs"
compatibility_date = "2026-09-26"

[assets]
directory = "./dist"
