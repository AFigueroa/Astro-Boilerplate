# Cloudflare Workers config — static site served as Workers static assets.
#
# The Git integration (Workers Builds) runs:
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy
# `wrangler deploy` reads this file and uploads ./dist. There's no Worker
# script (`main`) — the site is fully prerendered, so Cloudflare serves the
# files directly.
#
# `name` MUST match the Worker's name in the Cloudflare dashboard exactly,
# or Workers Builds fails with a name-mismatch error.

name = "portal"
compatibility_date = "2026-09-26"

[assets]
directory = "./dist"
